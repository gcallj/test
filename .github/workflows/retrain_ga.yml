name: Full Retrain GA (Staged)

on:
  workflow_dispatch:
    inputs:
      stages:
        description: 'Number of stages (each runs 10 gens)'
        default: '4'
        type: string
      pop_size:
        description: 'Population size'
        default: '40'
        type: string
      windows:
        description: 'Walk-forward windows'
        default: '6'
        type: string

jobs:
  retrain:
    runs-on: ubuntu-latest
    # Budget v4: stages=8 pop=80 windows=10 pode levar 10-12h.
    # Timeout 720 min (12h) — GitHub public repos permitem ate 72h/job.
    timeout-minutes: 720

    permissions:
      contents: write

    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GA_RUN_MODE: "train"
      GA_FAST_MODE: "false"
      GA_EVAL_WORKERS: "2"
      # Retrain NAO envia Telegram — so daily_pipeline.yml envia 1 msg/dia
      # com caption rico via send_telegram.py. Evita parallel sends com
      # formatos diferentes (ga_run internal vs send_telegram.py).
      GA_DISABLE_TELEGRAM_SEND: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Show current checkpoint
        run: |
          echo "Before retrain:"
          python3 -c "import json; d=json.load(open('global_ga_checkpoint.json')); print(f'  fitness={d[\"fitness\"]:.4f}')"
          echo "Config: pop=${{ inputs.pop_size }}, stages=${{ inputs.stages }}, windows=${{ inputs.windows }}"

      - name: Run ETL + Step 4 (fresh data + history)
        run: |
          python -u run_pipeline.py --steps 1
          python -u run_pipeline.py --steps 4

      - name: Backup pre-retrain checkpoint (rollback se guard rejeitar)
        run: |
          cp global_ga_checkpoint.json global_ga_checkpoint_pre_retrain.json.bak

      - name: Retrain GA (staged)
        run: |
          python3 -u -c "
          import os, json, time
          os.environ['GA_RUN_MODE'] = 'train'
          os.environ['GA_FAST_MODE'] = 'false'
          os.environ['GA_EVAL_WORKERS'] = '2'

          import ga_run
          ga_run.GA_STAGE1_POP_SIZE = int('${{ inputs.pop_size }}')
          ga_run.GA_STAGE1_NGEN = 10
          ga_run.GA_MAX_WINDOWS = int('${{ inputs.windows }}')
          ga_run.GA_MAX_WINDOWS_STAGE2 = min(int('${{ inputs.windows }}'), 6)
          ga_run.GA_EVAL_WORKERS = 2

          stages = int('${{ inputs.stages }}')
          for s in range(1, stages + 1):
              print(f'=== STAGE {s}/{stages} ===')
              ck = json.load(open('global_ga_checkpoint.json'))
              print(f'Starting fitness: {ck[\"fitness\"]:.4f}')
              t0 = time.time()
              ga_run.run()
              ck = json.load(open('global_ga_checkpoint.json'))
              print(f'Stage {s} done: fitness={ck[\"fitness\"]:.4f} ({time.time()-t0:.0f}s)')
          "

      - name: Show results
        if: always()
        run: |
          echo "After retrain:"
          python3 -c "import json; d=json.load(open('global_ga_checkpoint.json')); print(f'  fitness={d[\"fitness\"]:.4f}')"
          ls -lh summary_latest.xlsx apply_last_*d__H*.csv 2>/dev/null

      - name: Overfitting stage (pristine holdout + bootstrap + sensitivity)
        # Roda APOS o retrain mas ANTES de best_ever guard.
        # Se detectar overfit critico -> rollback backup + FAIL step
        # (propaga para subsequent steps `if: success()` que serao skipped).
        # --skip-sensitivity p/ nao dobrar tempo (sensitivity roda N genes*2 evals).
        # --strict faz com que MARGINAL tambem bloqueie commit (conservador).
        if: success()
        id: overfitting_stage
        run: |
          set +e
          python3 -u analysis/overfitting_stage.py --holdout-days 90 --bootstrap 200 --skip-sensitivity
          EXIT=$?
          echo "overfitting_exit=$EXIT" >> $GITHUB_OUTPUT
          if [ $EXIT -eq 2 ]; then
            echo "::error::Overfitting stage reportou OVERFIT critico — rollback + abort"
            cp global_ga_checkpoint_pre_retrain.json.bak global_ga_checkpoint.json
            echo "[overfitting] Checkpoint restaurado ao pre-retrain state"
            exit 2
          elif [ $EXIT -eq 1 ]; then
            echo "::warning::Overfitting stage reportou MARGINAL — seguindo com warning"
          fi
          exit 0

      - name: Upload overfitting report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: overfitting-report-${{ github.run_number }}
          path: |
            analysis/overfitting_stage_report.json
            analysis/overfitting_stage_report.md
          retention-days: 30
          if-no-files-found: ignore

      - name: Check retrained vs best_ever guard (rollback se pior)
        if: success()
        # Impede retrain pior que best_ever de sobrescrever main.
        # Se guard rejeitar, restaura backup e sai. Retry loop no push
        # abaixo so executa se guard passar.
        run: |
          python3 -c "
          import json, sys, shutil
          ck = json.load(open('global_ga_checkpoint.json'))
          c = ck.get('metrics_snapshot', {}).get('candidate', {})
          if not c.get('fit'):
              try:
                  import run_local_ga_staged as staged
                  import ga_run as gr
                  store, _w, _sg, _sf, _bg, _bf, _bi = staged.open_existing_store()
                  cache = staged.build_ticker_arrays_cache(store)
                  c = staged.evaluate_genome_full(ck['genome'], cache, gr)
              except Exception as e:
                  print(f'[WARN] eval falhou: {e}; seguindo sem guard')
                  sys.exit(0)
          cand_m = {
              'fit': float(c.get('fit', ck['fitness']) or 0.0),
              'wr_med_all': float(c.get('wr_med_all', 0.0) or 0.0),
              'mean_alpha_ann': float(c.get('mean_alpha_ann', 0.0) or 0.0),
              'n_ge_70': int(c.get('n_ge_70', 0) or 0),
          }
          from analysis.best_ever_guard import check_regression_vs_best, format_best_ever_summary, update_best_ever
          print('[GUARD]', format_best_ever_summary())
          ok, reason = check_regression_vs_best(cand_m)
          if not ok:
              print(f'[GUARD] REJEITA retrain: {reason}')
              shutil.copy('global_ga_checkpoint_pre_retrain.json.bak', 'global_ga_checkpoint.json')
              print('[GUARD] Main preservado em pre-retrain state')
              sys.exit(2)
          print(f'[GUARD] Retrain PASSOU: {reason}')
          update_best_ever(cand_m, ck['genome'], reason='retrain_ga_staged')
          "

      - name: Commit retrained checkpoint
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add global_ga_checkpoint.json apply_last_5d__H5.csv summary_latest.xlsx analysis/best_ever_tracker.json 2>/dev/null || true
          FITNESS=$(python3 -c "import json; print(f'{json.load(open(\"global_ga_checkpoint.json\"))[\"fitness\"]:.4f}')")
          # BRANCH-AWARE push: dispatch em branch nao-main push de volta na mesma branch.
          # Evita contaminar main com experimentos de feature engineering em branches
          # dedicadas (ex: feature-engineering-v8).
          BRANCH="${GITHUB_REF_NAME:-main}"
          echo "::notice::Pushing retrain result to branch: $BRANCH"
          if ! git diff --cached --quiet; then
            git commit -m "Retrain GA staged: fitness=${FITNESS}"
            for i in 1 2 3 4 5; do
              if git pull --rebase origin "$BRANCH" && git push origin "$BRANCH"; then
                echo "::notice::Push succeeded on attempt $i to $BRANCH"
                exit 0
              fi
              sleep $(( (RANDOM % 15) + 5 ))
            done
            echo "::error::Push failed after 5 retries"
            exit 1
          else
            echo "No changes (guard rejected ou sem delta)"
          fi

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retrain-output-${{ github.run_number }}
          path: |
            summary_latest.xlsx
            apply_last_5d__H5.csv
            global_ga_checkpoint.json
          retention-days: 30
