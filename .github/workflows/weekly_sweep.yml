name: Weekly Continuous Improvement Sweep

# Roda 1 ciclo de melhoria continua todo sabado as 22:00 UTC (19:00 BRT, mercado fechado).
# Faz UM sweep da categoria de genes menos-recentemente-explorada,
# aplica o candidato se passar nos guardrails, e da commit no log + state.
on:
  schedule:
    - cron: '0 22 * * 6'    # 22:00 UTC sabado = 19:00 BRT sabado
  workflow_dispatch:
    inputs:
      category:
        description: 'Override: A/B/C/D/E/F (default = least recent)'
        required: false
        default: ''
      max_cycles:
        description: 'Number of cycles to run (default 1)'
        required: false
        default: '1'

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 240   # ate 4h por cyclos (~30 min de sweep + apply + log + commit)

    permissions:
      contents: write   # precisamos commitar checkpoint + log

    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0   # precisa de historico para baseline = git:main

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Show baseline + current state
        run: |
          echo "=== Current checkpoint ==="
          python3 -c "import json; d=json.load(open('global_ga_checkpoint.json')); print(f'fitness={d[\"fitness\"]:.4f}  genome_len={len(d[\"genome\"])}'); print(f'accepted_reason={d.get(\"accepted_reason\", \"(none)\")}')"
          echo ""
          echo "=== Continuous improvement state ==="
          python3 run_continuous_improvement.py --status || echo "(no state yet)"

      - name: Run continuous improvement cycle(s)
        run: |
          CATEGORY="${{ github.event.inputs.category }}"
          MAX_CYCLES="${{ github.event.inputs.max_cycles || '1' }}"
          ARGS="--max-cycles $MAX_CYCLES --alpha-focus off"
          if [ -n "$CATEGORY" ]; then
            ARGS="$ARGS --category $CATEGORY"
          fi
          echo "Running: python run_continuous_improvement.py $ARGS"
          python -u run_continuous_improvement.py $ARGS

      - name: Regenerate learnings summary
        run: python analysis/sweep_learnings.py

      - name: Commit results back to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Add all artifacts produced by this cycle
          git add -A \
            global_ga_checkpoint.json \
            continuous_improvement_state.json \
            analysis/optimization_log.md \
            analysis/sweep_learnings_summary.md \
            local_fullmetric_sweep_continuous_*.json \
            local_ga_best_so_far.json \
            global_ga_checkpoint_*.json.bak 2>/dev/null || true
          # Only commit if there are staged changes
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "[weekly-sweep] continuous improvement cycle $(date -u +%Y-%m-%d)"
            git push origin HEAD:main
          fi

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: continuous-improvement-${{ github.run_number }}
          path: |
            global_ga_checkpoint.json
            continuous_improvement_state.json
            analysis/optimization_log.md
            analysis/sweep_learnings_summary.md
            local_fullmetric_sweep_continuous_*.json
          retention-days: 90

      - name: Send Telegram notification on promotion
        if: always()
        run: |
          # Check if a promotion happened in this cycle (state file delta)
          NEW_PROMOS=$(python3 -c "
          import json
          try:
            s = json.load(open('continuous_improvement_state.json'))
            print(s.get('total_promotions', 0))
          except Exception:
            print(0)
          ")
          echo "Total promotions to date: $NEW_PROMOS"
          # Optional: send a short Telegram ping. send_telegram.py expects
          # summary_latest.xlsx; here we just exit gracefully if absent.
          if [ -f summary_latest.xlsx ]; then
            python -u send_telegram.py || echo "Telegram send failed (non-fatal)"
          else
            echo "summary_latest.xlsx not present; skipping Telegram (next predict_daily run will refresh it)."
          fi
