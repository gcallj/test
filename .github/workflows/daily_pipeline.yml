name: Daily Stock Pipeline

on:
  schedule:
    - cron: '30 21 * * 1-5'   # 21:30 UTC = 18:30 BRT (apos fechamento B3)
  workflow_dispatch:            # permite rodar manualmente pelo GitHub

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GA_RUN_MODE: "load"      # daily = load checkpoint, no retrain
      GA_FAST_MODE: "true"     # ignored in load mode, but set for safety

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore model/checkpoint cache
        uses: actions/cache@v4
        with:
          path: |
            output/data/models/
            global_ga_checkpoint.json
          key: models-${{ github.sha }}
          restore-keys: models-

      - name: Run ETL (download fresh market data)
        run: python -u run_pipeline.py --steps 1

      - name: Run GA load (generate signals + send Telegram)
        run: python -u ga_run.py

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-output-${{ github.run_number }}
          path: |
            summary_latest.xlsx
            apply_last_5d__H5.csv
            global_ga_checkpoint.json
          retention-days: 30
