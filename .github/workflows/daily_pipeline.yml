name: Daily Stock Pipeline

on:
  schedule:
    - cron: '30 21 * * 1-5'   # 21:30 UTC = 18:30 BRT (apos fechamento B3)
  workflow_dispatch:            # permite rodar manualmente pelo GitHub

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GA_RUN_MODE: "load"
      GA_FAST_MODE: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify checkpoint exists (from git)
        run: |
          echo "Checkpoint file:"
          cat global_ga_checkpoint.json | python3 -c "import sys,json; d=json.load(sys.stdin); print(f'  fitness={d[\"fitness\"]:.4f}  genome_len={len(d[\"genome\"])}')"
          echo "Models dir:"
          ls -1 output/data/models/*.json output/data/models/*.cbm 2>/dev/null | head -5
          echo "  total files: $(ls output/data/models/ | wc -l)"

      - name: Run ETL + GA (download data + generate signals)
        run: python -u run_pipeline.py --ga-only

      - name: Verify outputs before upload
        if: always()
        run: |
          echo "=== Output files ==="
          ls -lh summary_latest.xlsx apply_last_*d__H*.csv 2>/dev/null || echo "WARNING: output files missing!"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-output-${{ github.run_number }}
          path: |
            summary_latest.xlsx
            apply_last_5d__H5.csv
            global_ga_checkpoint.json
          retention-days: 30
