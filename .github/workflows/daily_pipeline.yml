name: Daily Stock Pipeline

on:
  schedule:
    - cron: '30 21 * * *'    # 21:30 UTC = 18:30 BRT (TODOS os dias, incl. fins de semana)
  workflow_dispatch:           # permite rodar manualmente pelo GitHub

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GA_RUN_MODE: "load"
      GA_FAST_MODE: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify checkpoint exists
        run: |
          echo "Checkpoint file:"
          cat global_ga_checkpoint.json | python3 -c "import sys,json; d=json.load(sys.stdin); print(f'  fitness={d[\"fitness\"]:.4f}  genome_len={len(d[\"genome\"])}')"

      - name: Run daily pipeline (ETL + GA causal) — Telegram suppressed
        # Suppress ga_run internal Telegram: send_telegram.py below tem caption
        # mais rico (WR breakdown + Premium/HQ subsets + top buys). Um unico
        # envio por dia.
        env:
          GA_DISABLE_TELEGRAM_SEND: "1"
        run: python -u predict_daily.py

      - name: Send Telegram (enhanced caption, dedup-guarded)
        if: success()
        # Dedup guard (.telegram_last_sent.json) evita duplicata se o cron
        # rodar duas vezes no mesmo dia ou se o modelo nao melhorou.
        run: python -u send_telegram.py

      - name: Verify outputs
        if: always()
        run: |
          echo "=== Output files ==="
          ls -lh summary_latest.xlsx apply_last_*d__H*.csv 2>/dev/null || echo "WARNING: output files missing!"
          echo "=== Date in xlsx ==="
          python3 -c "
          from openpyxl import load_workbook
          wb = load_workbook('summary_latest.xlsx', read_only=True)
          ws = wb['Apply']
          h = [c.value for c in next(ws.rows)]
          r = next(ws.iter_rows(min_row=2, values_only=True))
          d = dict(zip(h, r))
          print(f'Date: {d[\"Date\"]}')
          print(f'Signal count: {sum(1 for _ in ws.iter_rows(min_row=2))} rows')
          wb.close()
          " || echo "Could not parse xlsx"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-output-${{ github.run_number }}
          path: |
            summary_latest.xlsx
            apply_last_5d__H5.csv
            global_ga_checkpoint.json
          retention-days: 30
