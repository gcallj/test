name: Testes do pipeline

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      HISTORY_CSV_URL: ${{ secrets.HISTORY_CSV_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: pip install pandas pyarrow numpy openpyxl xlsxwriter scipy scikit-learn

      - name: Baixar history_consolidated.csv (opcional)
        if: env.HISTORY_CSV_URL != ''
        run: |
          echo "Baixando history_consolidated.csv de URL configurada em secret..."
          curl -fL "$HISTORY_CSV_URL" -o history_consolidated.csv
          ls -lh history_consolidated.csv

      - name: Rodar testes
        run: python -m unittest discover -s tests -p 'test_*.py' -v
